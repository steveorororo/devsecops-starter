name: Secure Container Pipeline

on:
  pull_request:
    branches: [test-protection]

permissions:
  contents: read

jobs:

  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hadolint Scan
        run: |
          echo "=== Scanning Dockerfiles ==="
          docker run --rm -i hadolint/hadolint < ./Dockerfile

  pipeline-integrity-check:
    name: Pipeline Integrity Check
    runs-on: ubuntu-latest
    needs: dockerfile-lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify GitHub Actions are pinned
        run: |
          echo "Checking workflow files for floating tags"
          if grep -R "uses: .*@" .github/workflows | grep -vE "@[0-9a-f]{40}|@v[0-9]+"; then
            echo "Floating GitHub Action versions detected!"
            exit 1
          fi

      - name: Verify Trivy action reference exists
        run: |
          echo "Checking trivy-action reference..."
          grep -n "trivy-action" .github/workflows/secure-pipeline.yml || {
            echo "Trivy action not found in workflow!"
            exit 1
          }

  build-hardened-image:
    name: Build Hardened Image
    runs-on: ubuntu-latest
    needs: pipeline-integrity-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build hardened container image
        run: |
          docker build \
            -f Dockerfile.hardened \
            -t workstream-api:hardened .

  trivy-security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: build-hardened-image

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: workstream-api:hardened
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1

  gitleaks-secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    needs: dockerfile-lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gitleaks
        run: |
          docker run --rm -v $PWD:/repo \
          zricethezav/gitleaks:latest detect \
          --source=/repo \
          --no-git \
          --verbose || true


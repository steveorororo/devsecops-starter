name: Secure Container Pipeline

on:
  push:
    branches: [test-protection]
  pull_request:
    branches: [test-protection]

permissions:
  contents: read

jobs:
  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hadolint Scan
        run: |
          echo "=== Scanning Dockerfiles ==="
          docker run --rm -i hadolint/hadolint < ./chapter-04-docker/vulnerable-app/Dockerfile

  build-hardened-image:
    name: Build Hardened Image
    runs-on: ubuntu-latest
    needs: dockerfile-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build hardened container image
        working-directory: chapter-04-docker/vulnerable-app
        run: |
          docker build \
            -f Dockerfile.hardened \
            -t workstream-api:hardened .
          docker images workstream-api:hardened

  trivy-security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: build-hardened-image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild for scan
        working-directory: chapter-04-docker/vulnerable-app
        run: |
          docker build \
            -f Dockerfile.hardened \
            -t workstream-api:hardened .

      - name: Trivy Vulnerability Scan (CRITICAL blocks)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: workstream-api:hardened
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Trivy HIGH Scan (warn only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: workstream-api:hardened
          format: table
          severity: HIGH
          exit-code: '0'

      - name: Trivy Secret Scan (blocks)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: workstream-api:hardened
          scanners: secret
          exit-code: '1'

  gitleaks-secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    needs: dockerfile-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gitleaks
        run: |
          docker run --rm -v $PWD:/repo \
            zricethezav/gitleaks:latest detect \
            --source=/repo \
            --no-git \
            --verbose || true
